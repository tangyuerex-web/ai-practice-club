<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal profile and interactive space" />
    <title>Loading profile...</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="profile-page">
    <div class="profile-language-switch language-switch" role="group" aria-label="Choose language">
      <button type="button" class="active" data-language="en" aria-pressed="true">EN</button>
      <button type="button" data-language="zh" aria-pressed="false">中文</button>
    </div>
    <main id="profile-root" class="profile-loading" aria-live="polite">
      <div class="profile-loader">
        <span>P</span>
        <p id="profile-loading-text">Loading your personal website...</p>
      </div>
    </main>
    <script src="config.js"></script>
    <script src="profile.js"></script>
  </body>
</html>
